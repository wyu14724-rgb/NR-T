name: verify

on:
  push:
  pull_request:

jobs:
  tables:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -r requirements.txt
      - name: Rebuild tables and figures
        run: python reproduce.py
      - name: Fail if any rebuilt table differs from the committed one
        run: git diff --exit-code -- results/
